<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>async ready becomes true</title>
<style>html,body{margin:0;height:100%;overflow:hidden}body{background:linear-gradient(90deg,#101830,#f0c060)}</style>
</head>
<body>
<script>
let loaded = false;
setTimeout(() => { loaded = true; }, 400);
window.__shots = {
  // Resolves false until the assets are "loaded", then true.
  ready: async () => { await new Promise((resolve) => setTimeout(resolve, 50)); return loaded; },
  list: () => ["grad"],
  show() {},
};
</script>
</body>
</html>

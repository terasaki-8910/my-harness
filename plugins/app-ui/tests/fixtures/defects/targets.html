<!doctype html>
<html lang="ja">
<head>

  <title>Planted: target, text-size, contrast, token-size</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>今日のパン</h1>
  </header>
  <main>
    <button type="button" aria-label="検索" style="width: 32px; height: 32px; background: #F2F2F2;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>

    <p style="font-size: 9px;">9px の小さな注記</p>
    <p style="color: #9e9e9e;">薄い灰色の文字は白地で読みにくい</p>
    <p style="font-size: 19px;">19px は文字サイズの表にない</p>
    <div style="height: 900px;"></div>
    <div style="background: #1F1F1F; padding: 16px;"><p style="color: #5F5F5F;">折り返しより下の暗い帯の上の文字</p></div>
  </main>
